name: heypolo sitemap crawl

on:
  schedule:
    - cron: "0 4 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: heypolo-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run crawler
        run: python crawl.py || echo "crawl.py exited non-zero; failure report still written"
      - name: Commit snapshot and report
        if: always()
        run: |
          git config user.name "heypolo-crawl-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "crawl $(date -u +%F)"
            git push
          fi
